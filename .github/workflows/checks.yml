name: Code checks

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Flutter sources
        run: flutter analyze --no-pub --fatal-infos

      - name: Run Flutter tests
        run: flutter test --no-pub --reporter expanded

      - name: Build ARM64 APK
        run: flutter build apk --release --target-platform android-arm64 --no-pub

      - name: Run Android tests and lint
        run: android/gradlew -p android :app:testReleaseUnitTest :app:lintRelease -Ptarget-platform=android-arm64 --console=plain --no-daemon
